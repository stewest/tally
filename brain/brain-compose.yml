name: Starter Brain
description: >-
  A clean starter brain schema with the Telos Brain skillbook, execution tools
  (skills, memory, Q&A, inbox, organisation, unit of work, brain schema) and
  management tools (schema list/read/edit).

# Embedding model for semantic search (find_available_skills, blueprint search).
# voyage-* uses VOYAGE_API_KEY from this brain's .env. A local runner model
# such as local_1/nomic-embed-text uses LOCAL_LLM_1_BASE_URL (BRA210).
# Search only uses vectors stored for the current model.
embedding-model: voyage-3-lite

# Learning loop intensity. high enables auto-run of inbox workflows whose
# triggers declare a :high (or lower) learning-mode qualifier (BRA122 / BRA404).
# Apply workflows also require inbox weight 5 (`inbox:…:high:5`).
learning-mode: high

# Brain default when a workflow omits model:. One id, or an ordered
# comma-separated list. A workflow that sets model: uses that list for the
# whole run and does not fall through to this default (BRA210).
# Same role as Settings "Default LLM model" and DEFAULT_LLM_MODEL in .env.
# This template pins model: on each workflow, so those pins win until removed.
# Simulation modelOverride (this run only) still wins; older clients may send
# settingsOverride.model instead. A missing credential skips that list entry.
# Compose llm-model wins over DEFAULT_LLM_MODEL at deploy time, so leave this
# commented if you want Settings / .env to be the switch for workflows that
# omit model:.
# llm-model: anthropic/claude-sonnet-4-6
# Telos Cloud only (2× xAI list on brain credit). Unavailable on local Docker.
# llm-model: telosbrain/xai/grok-4.6
# llm-model: openrouter/anthropic/claude-sonnet-4.6
# llm-model: openrouter/auto
# llm-model: azure/gpt-4o-prod
# llm-model: local_1/qwen3:8b

# Checkpoints: weekly schedule plus a snapshot before each deploy.
checkpoint-strategy: Daily,BeforeDeploy

# Shared outbound host allowlist for async run callbacks and declared-tool
# webhooks (BRA201 §4.3). Defaults cover local harnesses: Brain-in-Docker
# reaches the host app via host.docker.internal (BRA106). Add production
# harness hosts here before deploying tools against them.
allowed-callback-domains:
  - host.docker.internal
  - localhost
  - 127.0.0.1
  - tally-stewwest.vercel.app

# Entities: top-level things the brain reasons about (multi-tenancy anchor).
entities:
  - code: organisation
    name: Organisation
    description: The host application organisation this brain is scoped to
  - code: clients
    name: Clients
    description: A client of the business

# Units of work: scoped pieces of work that trigger learning on completion.
unitsofwork:
  - code: jobs
    name: Jobs
    scope: entity:clients
  - code: insight
    name: Insight
    scope: entity:organisation
    variables:
      - key: insightId
        description: Host-app insight row this job is filling.

# Connectors are named integrations with external services (REST/MCP). Each file
# under connectors/ declares URL, auth type, scope and required auth parameters.
# Secret values are not stored here — they go in .env / BrainEnvironmentVariables
# (BRA202 / BRA209). Unlisted connector files are not deployed.
connectors:
  - connectors/my-app.yml

# Tools are split into execution (runtime) and management (brain maintenance).
# Unlisted tool-group manifests are not deployed. Tool names must be unique
# across groups.
tools:
  - tools/execution/skills/tools.yml
  - tools/execution/memory/tools.yml
  - tools/execution/qa/tools.yml
  - tools/execution/native/tools.yml
  - tools/execution/inbox/tools.yml
  - tools/execution/organisation/tools.yml
  - tools/execution/uow/tools.yml
  - tools/execution/simulation/tools.yml
  - tools/execution/brain-schema/tools.yml
  - tools/execution/my-app/tools.yml
  - tools/execution/finance/tools.yml
  - tools/management/schema/tools.yml

skills:
  - skills/telos-brain/skillbook.yml
  - skills/business/skillbook.yml

blueprints:
  - blueprints/memory/blueprint.yml
  - blueprints/company/blueprint.yml
  - blueprints/clients/blueprint.yml
  - blueprints/personal-finance/blueprint.yml

workflows:
  - workflows/system-prompt.md
  - workflows/chat.md
  - workflows/chat-title.md
  - workflows/finance-review.md
  - workflows/finance-insight.md
  - workflows/finance-daily.md
  - workflows/ask-question.md
  - workflows/create-frame-of-reference.md
  - workflows/review-unit-of-work.md
  - workflows/review-blueprint.md
  - workflows/research.md
  - workflows/eval.md
  - workflows/wf-sim.md
  - workflows/wf-compact.md
  - workflows/wf-inbox-plan.md
  - workflows/Maintenance/brain-system.md
  - workflows/Maintenance/triage.md
  - workflows/Maintenance/update-skill.md
  - workflows/Maintenance/update-workflow.md
  - workflows/Maintenance/update-brain.md
