name: transcribe_image
version: 1
description: Loads an image from a URL and returns the transcribed text via the brain's vision transcription service (Claude or OpenAI). Provide an optional prompt to guide what to extract; omit it to transcribe all visible text with no commentary.
system:
  tool: transcribe_image
parameters:
  - name: url
    param: url
    description: Required. HTTPS URL of the image to transcribe (png, jpg, jpeg, or webp).
    type: string
    required: true
  - name: prompt
    param: prompt
    description: Optional. Instruction for the vision model describing what to extract. When omitted, all visible text is transcribed with no commentary.
    type: string
    required: false
