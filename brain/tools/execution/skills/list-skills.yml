name: list_skills
version: 1
description: Lists every active skill in a SkillBook as CSV with columns code,name,description. Use when you need the full catalogue for a book; use find_available_skills for semantic search, and get_skill to load a skill's full instructions.
system:
  tool: list_skills
parameters:
  - name: skillbook_code
    param: skillbook_code
    description: Required. The code of the SkillBook to list (e.g. "BRA", "ENG").
    type: string
    required: true
