name: Inbox
description: System tools for the learning-signal inbox — create entries, list/read/update entries and tasks, route work by adding workflow-linked tasks, and persist run grading scores from eval workflows.
tools:
  - add-inbox-task.yml
  - create-inbox-entry.yml
  - get-inbox-entry.yml
  - list-inbox-entries.yml
  - list-inbox-tasks.yml
  - set-run-grading.yml
  - update-inbox-entry.yml
  - update-inbox-task.yml
